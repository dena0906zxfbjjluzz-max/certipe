[build-system]
requires = ["maturin>=1.0.0,<2.0.0"]
build-backend = "maturin"

[project]
name = "motor_rust"
version = "0.1.0"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
features = ["pyo3/extension-module"]
